
<!DOCTYPE html>
<html>
<head>
    <title>EduEnroll - Sign Up</title>
     <link rel="stylesheet" href="../style.css">
</head>
<body>

    <h3>EduEnroll - Sign Up</h3>

    <center>

        <table id="signupTable" width="450" cellpadding="10" cellspacing="0">

            <tr>
                <td align="center">
                    <h2 id="createTitle">Create Account</h2>
                    <p id="getStarted">Get started with EduEnroll</p>
                </td>
            </tr>

            <tr>
                <td>
                    <form>

                        <div id="roleBox">
                        <h3 id="selectRole">Select Role</h3>
                        <div id="roleOptions">
                        <label>
                        <input type="radio" name="role" checked>
                        Student
                        </label>
                        <label>
                        <input type="radio" name="role">
                        Teacher
                        </label>
                        </div>
                        </div>
                        
                        <label id="nameLabel">
                        <h3>Full Name</h3>
                        </label>
                        <input type="text" id="fullName" placeholder="Elena Rostova"
                        size="50" required>

                        <label id="emailAddressLabel">
                        <h3>Email Address</h3>
                        </label>
                        <input type="email" id="emailAddress"
                        placeholder="elena.rostova@example.com"
                        size="50" required>


                        <div id="passwordBox">
                            <div>
                                <label id="passwordLabel"><h3>Password</h3></label>
                                 <input type="password" id="newPassword"
                                 placeholder="Password" required>
                            </div>
                            <div>
                                <label id="confirmLabel"><h3>Confirm Password</h3></label>
                                <input type="password" id="confirmPassword"
                                 placeholder="Confirm Password" required>
                            </div>
                        </div>

                        

                        
                        <br>
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>
                        </label>

                        <br><br>

                        <center>
                            <button id="createAccount">
                                Create Account →
                            </button>
                        </center>

                        <center>
                            <hr id="loginLine">
                            <p id="signupLine">
                                Already have an account?
                                <a href="login.html">Sign In</a> 
                            </p>
                        </center>

                    </form>
                </td>
            </tr>

        </table>

    </center>

</body>
</html>
