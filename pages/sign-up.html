
<!DOCTYPE html>
<html>
<head>
    <title>EduEnroll - Sign Up</title>
</head>
<body>

    <h3>EduEnroll - Sign Up</h3>

    <center>

        <table width="450" cellpadding="10" cellspacing="0">

            <tr>
                <td align="center">
                    <h2>🎓 EduEnroll</h2>
                    <h2>Create Account</h2>
                    <p>Get started with EduEnroll</p>
                </td>
            </tr>

            <tr>
                <td>
                    <form>

                        <b>Select Role</b>
                        <br><br>

                        <input type="radio" name="role" checked>
                        Student

                        <input type="radio" name="role">
                        Teacher

                        <br><br>

                        <b>Full Name</b>
                        <br>
                        <input type="text" placeholder="Elena Rostova"
                        size="50" required>

                        <br><br>

                        <b>Email Address</b>
                        <br>
                        <input type="email"
                        placeholder="elena.rostova@example.com"
                        size="50" required>

                        <br><br>

                        <table width="100%">
                            <tr>
                                <td>
                                    <b>Password</b>
                                    <br>
                                    <input type="password"
                                    placeholder="Password" size="20"
                                    required>
                                </td>

                                <td>
                                    <b>Confirm Password</b>
                                    <br>
                                    <input type="password"
                                    placeholder="Confirm Password"
                                    size="20" required>
                                </td>
                            </tr>
                        </table>

                        <br>

                        <input type="checkbox" required>
                        I agree to the
                        <a href=" ">Terms of Service</a>
                        and
                        <a href=" ">Privacy Policy</a>

                        <br><br>

                        <center>
                            <button type="submit">
                                Create Account →
                            </button>
                        </center>

                        <br><br>

                        <hr>

                        <center>
                            <p>
                                Already have an account?
                                <a href=" ">Sign In</a>
                            </p>
                        </center>

                    </form>
                </td>
            </tr>

        </table>

    </center>

</body>
</html>
