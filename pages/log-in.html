<!DOCTYPE html>
<html>
<head>
    <title>EduEnroll - Sign In</title>
</head>
<body>

    <h3>EduEnroll - Sign In</h3>

    <center>
        <h2>🎓EduEnroll</h2>
        <h2>Welcome Back</h2>
        <p>Sign in to access your academic dashboard</p>

        <form>

            <input type="radio" name="role" checked> Student
            <input type="radio" name="role"> Teacher
            <input type="radio" name="role"> Admin

            <br><br>

            <label>Institutional Email</label><br>
            <input type="email" placeholder="student@edu.com" required>

            <br><br>

            <label>Password</label>
            <a href=" ">Forgot Password?</a><br>
            <input type="password" placeholder="Enter password" required>

            <br><br>

            <input type="checkbox" checked>
            Remember me on this device

            <br><br>

            <button type="submit">Sign In→</button>

            <br><br>

            <p>Don't have an account? <a href=" ">Sign Up</a></p>

        </form>
    </center>

</body>
</html>
